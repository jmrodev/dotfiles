# ==========================================
# Atajos del Sistema y Navegación Sway
# ==========================================
$bindsym $mod+i exec ~/.local/bin/sway-next-workspace-browser.sh
$bindsym $mod+g exec ~/.local/bin/sway-next-workspace-agy.sh
$bindsym $mod+o exec ~/.local/bin/sway-next-workspace-opencode.sh
$bindsym $mod+c exec ~/.local/bin/sway-next-workspace-agycode.sh

# Desvincular toggle split por defecto de $mod+e para usar Dolphin
$unbindsym $mod+e
$bindsym $mod+e exec ~/.local/bin/sway-next-workspace-dolphin.sh
