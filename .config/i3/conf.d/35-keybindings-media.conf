# ==============================================================================
# i3wm Media & Utility Keybindings
# Contiene atajos para control de audio, brillo y capturas de pantalla.
# ==============================================================================

# --- Gestión de Audio ---
# Teclas multimedia (si las tienes)
bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioMicMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && killall -SIGRTMIN+10 i3blocks

# Teclas F como alternativa
bindsym $mod+F12 exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && killall -SIGRTMIN+10 i3blocks
bindsym $mod+F11 exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && killall -SIGRTMIN+10 i3blocks
bindsym $mod+F10 exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && killall -SIGRTMIN+10 i3blocks
bindsym $mod+F9 exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && killall -SIGRTMIN+10 i3blocks

# Mezclador gráfico
bindsym $mod+Shift+v exec pavucontrol

# --- Gestión de Brillo ---
# Teclas multimedia
bindsym XF86MonBrightnessUp exec --no-startup-id xbacklight -inc 5 && killall -SIGRTMIN+11 i3blocks
bindsym XF86MonBrightnessDown exec --no-startup-id xbacklight -dec 5 && killall -SIGRTMIN+11 i3blocks

# Teclas F como alternativa
bindsym $mod+F8 exec --no-startup-id xbacklight -inc 5 && killall -SIGRTMIN+11 i3blocks
bindsym $mod+F7 exec --no-startup-id xbacklight -dec 5 && killall -SIGRTMIN+11 i3blocks

# --- Capturas de Pantalla ---
# Captura interactiva con Flameshot
bindsym Print exec flameshot gui

# Captura de selección (guarda archivo + portapapeles)
bindsym Shift+Print exec --no-startup-id "maim -s | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_selection.png | xclip -selection clipboard -t image/png"

# Captura de pantalla completa
bindsym Control+Print exec --no-startup-id "maim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_fullscreen.png"

# Captura de ventana activa
bindsym $mod+Print exec --no-startup-id "maim -i $(xdotool getactivewindow) ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_window.png"

# --- Utilidades adicionales ---
# Selector de dispositivos de audio
bindsym $mod+Shift+a exec --no-startup-id "wpctl status | grep -E 'Sinks:|Sources:' -A10 | grep -E '^\\s*[0-9]' | dmenu -p 'Audio Device:' | cut -d. -f1 | xargs wpctl set-default"

# --- Resumen de teclas ---
# Audio: F12/F11/F10/F9 o teclas multimedia + Super+V
# Brillo: F8/F7 o teclas multimedia  
# Capturas: Print, Shift+Print, Ctrl+Print, Super+Print
# Utilidades: Super+Shift+A (selector audio)