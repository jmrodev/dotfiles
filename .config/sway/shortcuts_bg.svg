  </g>

  <!-- Lista Completa de Atajos (4 Columnas) -->
  <g fill="#eeeeee" font-family="monospace" font-size="28" transform="translate(100, 100)">
    <text x="0" y="0" font-size="60" fill="#88ad62" font-weight="bold">Manjaro Sway - Atajos Completos</text>
    
    <!-- Columna 1: Apps & Básicos -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" font-size="38" fill="#88ad62" font-weight="bold">Lanzadores &amp; Apps</text>
      <text x="0" y="50"><tspan font-weight="bold" fill="#88ad62">Super + Enter</tspan>          Terminal (Directorio actual)</text>
      <text x="0" y="90"><tspan font-weight="bold" fill="#88ad62">Super + Shift + Enter</tspan>  Terminal (Home)</text>
      <text x="0" y="130"><tspan font-weight="bold" fill="#88ad62">Super + D</tspan>              Menú / Lanzador de Apps</text>
      <text x="0" y="170"><tspan font-weight="bold" fill="#88ad62">Alt + Espacio</tspan>          Menú / Lanzador de Apps</text>
      <text x="0" y="210"><tspan font-weight="bold" fill="#88ad62">Super + Shift + D</tspan>      Lanzador en un Workspace Nuevo</text>
      <text x="0" y="250"><tspan font-weight="bold" fill="#88ad62">Super + I</tspan>              Google Chrome (Personalizado)</text>
      <text x="0" y="290"><tspan font-weight="bold" fill="#88ad62">Super + G</tspan>              Archivos / Thunar (Personalizado)</text>
      
      <text x="0" y="370" font-size="38" fill="#88ad62" font-weight="bold">Herramientas</text>
      <text x="0" y="420"><tspan font-weight="bold" fill="#88ad62">Super + Shift + P</tspan>      Portapapeles (Historial)</text>
      <text x="0" y="460"><tspan font-weight="bold" fill="#88ad62">Ctrl + Alt + Supr</tspan>      Administrador de Tareas (btop)</text>
      <text x="0" y="500"><tspan font-weight="bold" fill="#88ad62">Alt + Shift + E</tspan>        Selector de Emojis</text>
      <text x="0" y="540"><tspan font-weight="bold" fill="#88ad62">Super + ?</tspan>              Ayuda / Cheat Sheet</text>
      <text x="0" y="580"><tspan font-weight="bold" fill="#88ad62">Super + Shift + S</tspan>      Abrir Soporte Manjaro</text>
      <text x="0" y="620"><tspan font-weight="bold" fill="#88ad62">Super + Shift + I</tspan>      Inhibir Reposo (Idle)</text>

      <text x="0" y="700" font-size="38" fill="#88ad62" font-weight="bold">Sistema &amp; Waybar</text>
      <text x="0" y="750"><tspan font-weight="bold" fill="#88ad62">Super + Shift + C</tspan>      Recargar Configuración Sway</text>
      <text x="0" y="790"><tspan font-weight="bold" fill="#88ad62">Super + Shift + B</tspan>      Ocultar/Mostrar Waybar</text>
      <text x="0" y="830"><tspan font-weight="bold" fill="#88ad62">Super + Clic Izq</tspan>       Arrastrar ventana (Mouse)</text>
      <text x="0" y="870"><tspan font-weight="bold" fill="#88ad62">Super + Clic Der</tspan>       Redimensionar ventana (Mouse)</text>
      
      <text x="0" y="950" font-size="38" fill="#88ad62" font-weight="bold">Teclas Libres (Para futuro uso)</text>
      <text x="0" y="1000"><tspan font-weight="bold" fill="#88ad62">Super + [ C, M, O, Q, T, U, X, Y, Z ]</tspan></text>
    </g>

    <!-- Columna 2: Foco & Ventanas -->
    <g transform="translate(900, 100)">
      <text x="0" y="0" font-size="38" fill="#88ad62" font-weight="bold">Gestión de Ventanas</text>
      <text x="0" y="50"><tspan font-weight="bold" fill="#88ad62">Super + Shift + Q</tspan>      Cerrar Ventana (Kill)</text>
      <text x="0" y="90"><tspan font-weight="bold" fill="#88ad62">Escape</tspan>                 Cerrar ventana flotante enfocada</text>
      
      <text x="0" y="170" font-size="38" fill="#88ad62" font-weight="bold">Mover Foco</text>
      <text x="0" y="220"><tspan font-weight="bold" fill="#88ad62">Super + Flechas</tspan>        Foco a Izq / Der / Arr / Abajo</text>
      <text x="0" y="260"><tspan font-weight="bold" fill="#88ad62">Super + H/J/K/L</tspan>        Foco (Estilo Vim)</text>
      <text x="0" y="300"><tspan font-weight="bold" fill="#88ad62">Super + P</tspan>              Lista de ventanas LRU (swayr)</text>
      <text x="0" y="340"><tspan font-weight="bold" fill="#88ad62">Alt + Tab</tspan>              Volver a ventana anterior</text>
      <text x="0" y="380"><tspan font-weight="bold" fill="#88ad62">Super + A</tspan>              Enfocar Ventana Padre</text>

      <text x="0" y="460" font-size="38" fill="#88ad62" font-weight="bold">Mover Ventanas</text>
      <text x="0" y="510"><tspan font-weight="bold" fill="#88ad62">Super + Sh + Flechas</tspan>   Mover ventana activa de lugar</text>
      <text x="0" y="550"><tspan font-weight="bold" fill="#88ad62">Super + Sh + H/J/K/L</tspan>   Mover ventana (Estilo Vim)</text>
      <text x="0" y="590"><tspan font-weight="bold" fill="#88ad62">Super + Sh + 1..0</tspan>      Mover ventana a Workspace 1..10</text>
      <text x="0" y="630"><tspan font-weight="bold" fill="#88ad62">Super + Sh + N</tspan>         Mover ventana a Nuevo Workspace</text>
      <text x="0" y="670"><tspan font-weight="bold" fill="#88ad62">Super + Sh + M</tspan>         Mover ventana a Nuevo WS y cambiar</text>
    </g>

    <!-- Columna 3: Layouts & Workspaces -->
    <g transform="translate(1800, 100)">
      <text x="0" y="0" font-size="38" fill="#88ad62" font-weight="bold">Estructura &amp; Layout</text>
      <text x="0" y="50"><tspan font-weight="bold" fill="#88ad62">Super + B</tspan>              Dividir Horizontalmente</text>
      <text x="0" y="90"><tspan font-weight="bold" fill="#88ad62">Super + V</tspan>              Dividir Verticalmente</text>
      <text x="0" y="130"><tspan font-weight="bold" fill="#88ad62">Super + S</tspan>              Diseño Apilado (Stacking)</text>
      <text x="0" y="170"><tspan font-weight="bold" fill="#88ad62">Super + W</tspan>              Diseño en Pestañas (Tabbed)</text>
      <text x="0" y="210"><tspan font-weight="bold" fill="#88ad62">Super + E</tspan>              Alternar Split</text>
      
      <text x="0" y="290" font-size="38" fill="#88ad62" font-weight="bold">Modos Visuales</text>
      <text x="0" y="340"><tspan font-weight="bold" fill="#88ad62">Super + F</tspan>              Pantalla Completa Normal</text>
      <text x="0" y="380"><tspan font-weight="bold" fill="#88ad62">Super + Shift + F</tspan>      Pantalla Completa Global</text>
      <text x="0" y="420"><tspan font-weight="bold" fill="#88ad62">Super + Espacio</tspan>        Alternar foco entre Tiling/Flotante</text>
      <text x="0" y="460"><tspan font-weight="bold" fill="#88ad62">Super + Sh + Espacio</tspan>   Activar/Desactivar Flotante en ventana</text>

      <text x="0" y="540" font-size="38" fill="#88ad62" font-weight="bold">Navegar Workspaces</text>
      <text x="0" y="590"><tspan font-weight="bold" fill="#88ad62">Super + 1..0</tspan>           Ir al Workspace 1..10</text>
      <text x="0" y="630"><tspan font-weight="bold" fill="#88ad62">Super + N</tspan>              Ir al Primer Workspace Vacío</text>
      <text x="0" y="670"><tspan font-weight="bold" fill="#88ad62">Super + Tab</tspan>            Alternar último Workspace usado</text>
      <text x="0" y="710"><tspan font-weight="bold" fill="#88ad62">Super + Alt + Flechas</tspan>  Mover Workspace a otro Monitor</text>
      
      <text x="0" y="790" font-size="38" fill="#88ad62" font-weight="bold">Escalado (Pantalla)</text>
      <text x="0" y="840"><tspan font-weight="bold" fill="#88ad62">Alt + Plus (+)</tspan>         Aumentar Escala</text>
      <text x="0" y="880"><tspan font-weight="bold" fill="#88ad62">Alt + Menos (-)</tspan>        Disminuir Escala</text>
      <text x="0" y="920"><tspan font-weight="bold" fill="#88ad62">Super + Igual (=)</tspan>      Escala por Defecto</text>
    </g>
  </g>
</svg>
