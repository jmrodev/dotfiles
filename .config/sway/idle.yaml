---
debug: false
wait: false
timeouts:
  # idle_timeout: dim the screen after 240s
  - timeout: 240
    command: brightnessctl -s && brightnessctl set 10
    resume: brightnessctl -r
  # locking_timeout: lock the screen after 300s
  - timeout: 300
    command: swaymsg exec \$locking
  # keyboard_timeout: turn off keyboard backlight after 600s
  - timeout: 600
    command: /usr/share/sway/scripts/keyboard-backlight-switch.sh off
    resume: /usr/share/sway/scripts/keyboard-backlight-switch.sh on
  # screen_timeout: turn off display after 600s
  - timeout: 600
    command: swaymsg "output * power off"
    resume: swaymsg "output * power on"
  # sleep_timeout: suspend after 900s
  - timeout: 900
    command: systemctl sleep
before-sleep: swaymsg exec \$locking
after-resume: swaymsg "output * power on" && brightnessctl -r
lock: swaymsg exec \$locking
idlehint: '240'
