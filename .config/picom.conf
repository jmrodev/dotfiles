# =========== Sombras ===========
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.75;
shadow-offset-x = -7;
shadow-offset-y = -7;
# Evita dibujar sombras en ciertos elementos para mejorar el rendimiento.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c"
];

# =========== Fundidos (Fading) ===========
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# =========== Opacidad ===========
inactive-opacity = 1; # No reducir opacidad de ventanas inactivas
frame-opacity = 1;
inactive-opacity-override = false;

# =========== Blur (DESACTIVADO POR RENDIMIENTO) ===========
# El desenfoque es la causa más común de "lag" visual.
# Se recomienda mantenerlo desactivado para máxima fluidez.
blur: {
  method = "none";
  strength = 0;
}
# blur-background-exclude = [];

# =========== Opciones Generales (Backend y VSync) ===========
# Este es el backend más moderno y recomendado.
backend = "glx";

# VSync previene el "tearing" (pantalla partida).
vsync = true;

# Otras optimizaciones
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-stencil = true;
use-damage = true;
log-level = "warn";
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.9; }
  dropdown_menu = { opacity = 0.9; }
};