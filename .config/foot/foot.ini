include=~/.config/foot/foot-theme.ini

[main]
shell=/usr/bin/fish
font=JetBrainsMono Nerd Font:size=14
pad=10x10 center
selection-target=both

[colors]
alpha=0.9
foreground=eeeeee
background=141a1b
regular0=141a1b  # black
regular1=cd3f45  # red
regular2=88ad62  # green
regular3=e6cd69  # yellow
regular4=16a085  # blue
regular5=a074c4  # magenta
regular6=55b5db  # cyan
regular7=d6d6d6  # white
bright0=41535B   # bright black
bright1=cd3f45  # red
bright2=88ad62  # green
bright3=e6cd69  # yellow
bright4=16a085  # blue
bright5=a074c4  # magenta
bright6=55b5db  # cyan
bright7=ffffff   # bright white

[key-bindings]
clipboard-paste=Control+v Control+Shift+v XF86Paste
clipboard-copy=Control+Shift+c XF86Copy

[mouse-bindings]
primary-paste=BTN_MIDDLE
