# ==============================================================================
# Clipboard Sync and History Configuration (cliphist & wl-clipboard)
# ==============================================================================

# 1. Keep clipboard content active after application closes
exec wl-clip-persist --clipboard both

# 2. Sync PRIMARY selection (selected text) directly to CLIPBOARD selection
# This allows any selected text to be pasted with Ctrl+V and goes into history
exec wl-paste --primary --watch wl-copy

# 3. Store clipboard history (text and images) in cliphist database
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

# 4. Bind keymap to open clipboard history manager via Wofi
# (Mod + Shift + V opens the clipboard manager)
bindsym Mod4+Shift+v exec $clipboard
