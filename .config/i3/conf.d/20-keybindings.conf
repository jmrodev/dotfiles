bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && killall -SIGRTMIN+10 i3blocks
bindsym XF86AudioMicMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && killall -SIGRTMIN+10 i3blocks
bindsym XF86MonBrightnessUp exec --no-startup-id xbacklight -inc 5 && killall -SIGRTMIN+11 i3blocks
bindsym XF86MonBrightnessDown exec --no-startup-id xbacklight -dec 5 && killall -SIGRTMIN+11 i3blocks
bindsym $mod+Return exec i3-sensible-terminal
bindsym $mod+Shift+q kill
bindsym $mod+d exec --no-startup-id "rofi -show drun -show-icons"
bindsym Mod1+Tab exec --no-startup-id "rofi -show window -show-icons"
bindsym $mod+Mod1+g exec google-chrome-stable
bindsym $mod+Mod1+n exec xfce4-terminal -e nvim
bindsym $mod+Mod1+r exec xfce4-terminal -e ranger
bindsym $mod+Mod1+t exec pcmanfm
bindsym Print exec flameshot gui
bindsym Shift+Print exec --no-startup-id "maim -s | tee ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_selection.png | xclip -selection clipboard -t image/png"
bindsym Control+Print exec --no-startup-id "maim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S)_fullscreen.png"
bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+l focus up
bindsym $mod+ntilde focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right
bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+ntilde move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right
bindsym $mod+h split h
bindsym $mod+v split v
bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent
bindsym $mod+1 workspace $ws1
bindsym $mod+2 workspace $ws2
bindsym $mod+3 workspace $ws3
bindsym $mod+4 workspace $ws4
bindsym $mod+5 workspace $ws5
bindsym $mod+6 workspace $ws6
bindsym $mod+7 workspace $ws7
bindsym $mod+8 workspace $ws8
bindsym $mod+9 workspace $ws9
bindsym $mod+0 workspace $ws10
bindsym $mod+Shift+1 move container to workspace $ws1
bindsym $mod+Shift+2 move container to workspace $ws2
bindsym $mod+Shift+3 move container to workspace $ws3
bindsym $mod+Shift+4 move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+6 move container to workspace $ws6
bindsym $mod+Shift+7 move container to workspace $ws7
bindsym $mod+Shift+8 move container to workspace $ws8
bindsym $mod+Shift+9 move container to workspace $ws9
bindsym $mod+Shift+0 move container to workspace $ws10
bindsym $mod+t exec i3-input -F 'rename workspace to "%s"' -P 'Nuevo nombre para workspace: '
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m '¿Realmente quieres salir de i3? Esto terminará tu sesión X.' -B 'Sí, salir de i3' 'i3-msg exit'"
mode "resize" {
    bindsym j resize shrink width 10 px or 10 ppt
    bindsym k resize grow height 10 px or 10 ppt
    bindsym l resize shrink height 10 px or 10 ppt
    
    bindsym ntilde resize grow width 10 px or 10 ppt

    bindsym Left resize shrink width 10 px or 10 ppt
    bindsym Down resize grow height 10 px or 10 ppt
    bindsym Up resize shrink height 10 px or 10 ppt
    bindsym Right resize grow width 10 px or 10 ppt

    bindsym Return mode "default"
    bindsym Escape mode "default"
    
    bindsym $mod+r mode "default"
}
bindsym $mod+r mode "resize"
mode "sistema" {
    bindsym l exec --no-startup-id i3lock --color 000000; mode "default"
    bindsym x exec --no-startup-id "i3-nagbar -t warning -m '¿Salir de i3?' -B 'Sí' 'i3-msg exit'"; mode "default"
    bindsym s exec --no-startup-id "systemctl suspend && i3lock --color 000000"; mode "default"
    bindsym h exec --no-startup-id "systemctl hibernate && i3lock --color 000000"; mode "default"
    bindsym r exec --no-startup-id systemctl reboot; mode "default"
    bindsym p exec --no-startup-id systemctl poweroff; mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+Pause mode "sistema"
bindsym $mod+F1 exec --no-startup-id $scriptsdir/enhanced_i3_bindings.sh