# Foot Terminal Configuration
include=/usr/share/sway/templates/foot.ini

[main]
font=JetBrainsMono Nerd Font:size=13
pad=15x15
initial-window-size-chars=100x30
# Automatically copy selected text to clipboard
selection-target=both

[colors-dark]
alpha=0.85
foreground=eeeeee
background=141a1b

## Normal colors
regular0=141a1b  # black
regular1=cd3f45  # red
regular2=9fca56  # green
regular3=e6cd69  # yellow
regular4=16a085  # blue (maia)
regular5=a074c4  # magenta
regular6=55b5db  # cyan
regular7=d6d6d6  # white

## Bright colors
bright0=41535b   # bright black
bright1=ff5555   # bright red
bright2=50fa7b   # bright green
bright3=f1fa8c   # bright yellow
bright4=8be9fd   # bright blue
bright5=ff79c6   # bright magenta
bright6=8be9fd   # bright cyan
bright7=ffffff   # bright white

## Cursor colors
cursor=141a1b 16a085

[cursor]
style=beam
blink=yes

[key-bindings]
# Enable standard Ctrl+Shift+C / Ctrl+Shift+V for copy/paste
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
