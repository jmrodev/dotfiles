# --- Lanzadores ---
# Lanzador principal (Wofi es nativo de Wayland)
bindsym $mod+d exec "wofi --show drun"

# --- Aplicaciones Comunes ---
bindsym $mod+Control+g exec google-chrome-stable
bindsym $mod+Control+n exec foot -e nvim
bindsym $mod+Control+r exec foot -e ranger
bindsym $mod+Mod1+t exec dolphin || pcmanfm

# Atajo para Gemini (Adaptado de tu i3)
bindsym $mod+Mod1+1 exec foot -e zsh -ic 'gemini -m gemini-2.5-flash'

# --- Utilidades ---
# Captura de pantalla (Requiere grim y slurp)
bindsym Print exec grim -g "$(slurp)" ~/Imágenes/$(date +%Y-%m-%d-%H%M%S).png && notify-send "Captura guardada"
