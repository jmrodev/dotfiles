set $term footclient -o "font=JetBrainsMono Nerd Font:size=14" -o "pad=10x10" /usr/bin/fish
set $term_cwd footclient -o "font=JetBrainsMono Nerd Font:size=14" -o "pad=10x10" --working-directory "$(swaycwd 2>/dev/null || echo $HOME)" /usr/bin/fish
set $term_float footclient -o "font=JetBrainsMono Nerd Font:size=14" -o "pad=10x10" --app-id floating_shell /usr/bin/fish
