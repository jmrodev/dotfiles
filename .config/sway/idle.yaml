---
debug: false
wait: false
timeouts:
  # idle_timeout: dim the screen after 600s
  - timeout: 600
    command: brightnessctl -s && brightnessctl set 10
    resume: brightnessctl -r
  # locking_timeout: lock the screen after 900s (15 min)
  - timeout: 900
    command: swaymsg exec \$locking
  # keyboard_timeout: turn off keyboard backlight after 900s
  - timeout: 900
    command: /usr/share/sway/scripts/keyboard-backlight-switch.sh off
    resume: /usr/share/sway/scripts/keyboard-backlight-switch.sh on
  # screen_timeout: turn off display after 900s
  - timeout: 900
    command: swaymsg "output * power off"
    resume: swaymsg "output * power on"
  # sleep_timeout: suspend after 1800s (30 min)
  - timeout: 1800
    command: systemctl sleep
before-sleep: fusermount -u -z /home/jmro/Mounts/ServerDebian 2>/dev/null; swaymsg exec \$locking
after-resume: swaymsg "output * power on" && brightnessctl -r
lock: swaymsg exec \$locking
idlehint: '600'
