[opener]
edit = [
	{ run = "micro %s", block = true, for = "unix", desc = "Editar con micro" },
]
view = [
	{ run = "bat --paging=always %s", block = true, for = "unix", desc = "Ver con bat" },
]

[preview]
image_filter = "lanczos3"

[open]
rules = [
	# Carpeta
	{ mime = "folder/*", use = [ "edit", "open", "reveal" ] },
	# Texto y codigo: ver con bat, editar con micro
	{ mime = "text/*", use = [ "view", "edit", "reveal" ] },
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini,yaml,toml}", use = [ "view", "edit", "reveal" ] },
	# Imagen
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Archivo comprimido
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# Archivo vacio
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Sistema de archivos virtual
	{ mime = "vfs/{absent,stale}", use = "download" },
	# Papelera
	{ mime = "trash/**", use = [ "open", "trash" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]
