<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i3wm Interactive Cheat Sheet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-card: #3a3a3a;
            --accent: #4c7899;
            --accent-light: #5a8bb0;
            --text-primary: #ffffff;
            --text-secondary: #bbbbbb;
            --text-muted: #888888;
            --border: #555555;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #f44336;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: rgba(76, 120, 153, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 25px;
            padding: 0.75rem 1rem 0.75rem 3rem;
            color: var(--text-primary);
            width: 300px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(76, 120, 153, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .filter-select {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            min-width: 150px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .bindings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .category-section {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .category-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .category-header {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            padding: 1rem 1.5rem;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .category-icon {
            font-size: 1.3rem;
        }

        .binding-list {
            padding: 1rem;
        }

        .binding-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
            transition: all 0.3s ease;
            gap: 1rem;
        }

        .binding-item:hover {
            background: rgba(76, 120, 153, 0.1);
            transform: translateX(5px);
        }

        .binding-item:last-child {
            margin-bottom: 0;
        }

        .keybind {
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            color: var(--accent-light);
            background: rgba(76, 120, 153, 0.1);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            border: 1px solid rgba(76, 120, 153, 0.3);
            white-space: nowrap;
            font-size: 0.85rem;
        }

        .description {
            color: var(--text-secondary);
            flex-grow: 1;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .mode-badge {
            background: var(--warning);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .workspace-item {
            background: var(--bg-secondary);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.3s ease;
        }

        .workspace-item:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        .workspace-number {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        .workspace-icon {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }

        .workspace-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .footer {
            background: var(--bg-secondary);
            padding: 2rem 0;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .search-controls {
                flex-direction: column;
                width: 100%;
            }

            .search-input {
                width: 100%;
            }

            .bindings-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 1rem;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .stats {
                justify-content: center;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 120, 153, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(76, 120, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 120, 153, 0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="title">📦 i3wm Interactive Cheat Sheet</h1>
                <div class="search-controls">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" class="search-input" placeholder="Buscar atajos...">
                    </div>
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">Todas las categorías</option>
                    </select>
                    <select id="modeFilter" class="filter-select">
                        <option value="all">Todos los modos</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="stats" id="stats">
            <!-- Statistics cards will be populated by JavaScript -->
        </div>

        <div id="workspacesSection">
            <div class="category-section">
                <div class="category-header">
                    <span class="category-icon">🖥️</span>
                    Workspaces
                </div>
                <div class="binding-list">
                    <div class="workspace-grid" id="workspaceGrid">
                        <!-- Workspace items will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <div class="bindings-grid" id="bindingsContainer">
            <!-- Binding categories will be populated by JavaScript -->
        </div>

        <div id="noResults" class="no-results" style="display: none;">
            <p>🔍 No se encontraron atajos que coincidan con tu búsqueda</p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;">Intenta con otros términos o cambia los filtros</p>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>i3wm Cheat Sheet - Generado dinámicamente desde tu configuración</p>
            <p style="margin-top: 0.5rem; font-size: 0.8rem;">💡 Usa <kbd>Mod</kbd> para referirte a tu tecla Super/Windows</p>
        </div>
    </div>

    <script>
        // i3 bindings data based on your configuration
        const i3Bindings = {
            workspaces: [
                { number: 1, icon: "", label: "Terminal" },
                { number: 2, icon: "", label: "Web" },
                { number: 3, icon: "", label: "Code" },
                { number: 4, icon: "", label: "Files" },
                { number: 5, icon: "", label: "Chat/Comms" },
                { number: 6, icon: "6", label: "General" },
                { number: 7, icon: "7", label: "General" },
                { number: 8, icon: "", label: "Music" },
                { number: 9, icon: "漣", label: "Settings/Misc" },
                { number: 10, icon: "", label: "Video/Media" }
            ],
            categories: {
                "Básico": {
                    icon: "🏠",
                    bindings: [
                        { key: "Mod + Enter", desc: "Abrir terminal", mode: "default" },
                        { key: "Mod + Shift + q", desc: "Cerrar ventana", mode: "default" },
                        { key: "Mod + d", desc: "Lanzador de aplicaciones (Rofi)", mode: "default" },
                        { key: "Alt + Tab", desc: "Cambiar entre ventanas (Rofi)", mode: "default" }
                    ]
                },
                "Navegación": {
                    icon: "🧭",
                    bindings: [
                        { key: "Mod + j/k/l/ñ", desc: "Navegar entre ventanas (hjkl)", mode: "default" },
                        { key: "Mod + ←/↓/↑/→", desc: "Navegar entre ventanas (flechas)", mode: "default" },
                        { key: "Mod + 1-0", desc: "Cambiar a workspace", mode: "default" },
                        { key: "Mod + Shift + 1-0", desc: "Mover ventana a workspace", mode: "default" }
                    ]
                },
                "Organización": {
                    icon: "📐",
                    bindings: [
                        { key: "Mod + h", desc: "Dividir horizontalmente", mode: "default" },
                        { key: "Mod + v", desc: "Dividir verticalmente", mode: "default" },
                        { key: "Mod + f", desc: "Pantalla completa", mode: "default" },
                        { key: "Mod + s", desc: "Layout apilado", mode: "default" },
                        { key: "Mod + w", desc: "Layout con pestañas", mode: "default" },
                        { key: "Mod + e", desc: "Alternar split layout", mode: "default" },
                        { key: "Mod + Shift + Space", desc: "Ventana flotante", mode: "default" },
                        { key: "Mod + Space", desc: "Alternar focus flotante/tiling", mode: "default" }
                    ]
                },
                "Mover Ventanas": {
                    icon: "🔄",
                    bindings: [
                        { key: "Mod + Shift + j/k/l/ñ", desc: "Mover ventana (hjkl)", mode: "default" },
                        { key: "Mod + Shift + ←/↓/↑/→", desc: "Mover ventana (flechas)", mode: "default" }
                    ]
                },
                "Redimensionar": {
                    icon: "📏",
                    bindings: [
                        { key: "Mod + r", desc: "Entrar en modo resize", mode: "default" },
                        { key: "j/k/l/ñ", desc: "Redimensionar ventana", mode: "resize" },
                        { key: "←/↓/↑/→", desc: "Redimensionar ventana", mode: "resize" },
                        { key: "Enter/Escape", desc: "Salir del modo resize", mode: "resize" }
                    ]
                },
                "Sistema": {
                    icon: "⚙️",
                    bindings: [
                        { key: "Mod + Shift + c", desc: "Recargar configuración", mode: "default" },
                        { key: "Mod + Shift + r", desc: "Reiniciar i3", mode: "default" },
                        { key: "Mod + Shift + e", desc: "Salir de i3", mode: "default" },
                        { key: "Mod + t", desc: "Renombrar workspace", mode: "default" }
                    ]
                },
                "Aplicaciones": {
                    icon: "🚀",
                    bindings: [
                        { key: "Mod + Alt + g", desc: "Google Chrome", mode: "default" },
                        { key: "Mod + Alt + n", desc: "Nvim en terminal", mode: "default" },
                        { key: "Mod + Alt + t", desc: "Gestor de archivos (PCManFM)", mode: "default" },
                        { key: "Ctrl + →", desc: "Ranger (gestor archivos)", mode: "default" }
                    ]
                },
                "Multimedia": {
                    icon: "🎵",
                    bindings: [
                        { key: "XF86AudioRaiseVolume", desc: "Subir volumen (+5%)", mode: "default" },
                        { key: "XF86AudioLowerVolume", desc: "Bajar volumen (-5%)", mode: "default" },
                        { key: "XF86AudioMute", desc: "Silenciar/Activar audio", mode: "default" },
                        { key: "XF86AudioMicMute", desc: "Silenciar/Activar micrófono", mode: "default" },
                        { key: "XF86MonBrightnessUp", desc: "Aumentar brillo (+5%)", mode: "default" },
                        { key: "XF86MonBrightnessDown", desc: "Disminuir brillo (-5%)", mode: "default" }
                    ]
                },
                "Capturas": {
                    icon: "📸",
                    bindings: [
                        { key: "Print", desc: "Captura interactiva (Flameshot)", mode: "default" },
                        { key: "Shift + Print", desc: "Captura de selección (Maim)", mode: "default" },
                        { key: "Ctrl + Print", desc: "Captura completa (Maim)", mode: "default" }
                    ]
                }
            }
        };

        let currentSearch = '';
        let currentCategoryFilter = 'all';
        let currentModeFilter = 'all';

        // Initialize the application
        function init() {
            populateFilters();
            populateWorkspaces();
            renderBindings();
            updateStats();
            setupEventListeners();
        }

        function populateFilters() {
            const categoryFilter = document.getElementById('categoryFilter');
            const modeFilter = document.getElementById('modeFilter');

            // Populate categories
            Object.keys(i3Bindings.categories).forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });

            // Populate modes
            const modes = new Set();
            Object.values(i3Bindings.categories).forEach(category => {
                category.bindings.forEach(binding => {
                    modes.add(binding.mode);
                });
            });

            modes.forEach(mode => {
                const option = document.createElement('option');
                option.value = mode;
                option.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
                modeFilter.appendChild(option);
            });
        }

        function populateWorkspaces() {
            const workspaceGrid = document.getElementById('workspaceGrid');
            
            i3Bindings.workspaces.forEach(ws => {
                const wsElement = document.createElement('div');
                wsElement.className = 'workspace-item';
                wsElement.innerHTML = `
                    <span class="workspace-number">${ws.number}</span>
                    <div class="workspace-icon">${ws.icon}</div>
                    <div class="workspace-label">${ws.label}</div>
                `;
                workspaceGrid.appendChild(wsElement);
            });
        }

        function renderBindings() {
            const container = document.getElementById('bindingsContainer');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            const filteredCategories = getFilteredCategories();
            
            if (Object.keys(filteredCategories).length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noResults.style.display = 'none';

            Object.entries(filteredCategories).forEach(([categoryName, categoryData]) => {
                const section = document.createElement('div');
                section.className = 'category-section fade-in';
                
                section.innerHTML = `
                    <div class="category-header">
                        <span class="category-icon">${categoryData.icon}</span>
                        ${categoryName}
                    </div>
                    <div class="binding-list">
                        ${categoryData.bindings.map(binding => `
                            <div class="binding-item">
                                <div class="keybind">${binding.key}</div>
                                <div class="description">${binding.desc}</div>
                                ${binding.mode !== 'default' ? `<div class="mode-badge">${binding.mode}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
                
                container.appendChild(section);
            });
        }

        function getFilteredCategories() {
            const filtered = {};

            Object.entries(i3Bindings.categories).forEach(([categoryName, categoryData]) => {
                // Apply category filter
                if (currentCategoryFilter !== 'all' && categoryName !== currentCategoryFilter) {
                    return;
                }

                // Filter bindings by search and mode
                const filteredBindings = categoryData.bindings.filter(binding => {
                    const matchesSearch = currentSearch === '' || 
                        binding.key.toLowerCase().includes(currentSearch.toLowerCase()) ||
                        binding.desc.toLowerCase().includes(currentSearch.toLowerCase());
                    
                    const matchesMode = currentModeFilter === 'all' || binding.mode === currentModeFilter;
                    
                    return matchesSearch && matchesMode;
                });

                if (filteredBindings.length > 0) {
                    filtered[categoryName] = {
                        ...categoryData,
                        bindings: filteredBindings
                    };
                }
            });

            return filtered;
        }

        function updateStats() {
            const statsContainer = document.getElementById('stats');
            
            const totalBindings = Object.values(i3Bindings.categories)
                .reduce((total, category) => total + category.bindings.length, 0);
            
            const totalCategories = Object.keys(i3Bindings.categories).length;
            const totalWorkspaces = i3Bindings.workspaces.length;
            
            const modes = new Set();
            Object.values(i3Bindings.categories).forEach(category => {
                category.bindings.forEach(binding => modes.add(binding.mode));
            });

            statsContainer.innerHTML = `
                <div class="stat-card">
                    <span class="stat-number">${totalBindings}</span>
                    <div class="stat-label">Atajos Totales</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${totalCategories}</span>
                    <div class="stat-label">Categorías</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${totalWorkspaces}</span>
                    <div class="stat-label">Workspaces</div>
                </div>
                <div class="stat-card">
                    <span class="stat-number">${modes.size}</span>
                    <div class="stat-label">Modos</div>
                </div>
            `;
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const categoryFilter = document.getElementById('categoryFilter');
            const modeFilter = document.getElementById('modeFilter');

            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                renderBindings();
            });

            categoryFilter.addEventListener('change', (e) => {
                currentCategoryFilter = e.target.value;
                renderBindings();
            });

            modeFilter.addEventListener('change', (e) => {
                currentModeFilter = e.target.value;
                renderBindings();
            });

            // Add keyboard shortcuts for the cheat sheet itself
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === '/') {
                    e.preventDefault();
                    searchInput.focus();
                }
                
                if (e.key === 'Escape' && document.activeElement === searchInput) {
                    searchInput.blur();
                    searchInput.value = '';
                    currentSearch = '';
                    renderBindings();
                }
            });
        }

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
