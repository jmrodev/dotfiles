# ==========================================
# Atajos del Sistema y Navegación Sway
# ==========================================
$bindsym $mod+i exec ~/.local/bin/sway-next-workspace-browser.sh
$bindsym $mod+g exec ~/.local/bin/sway-next-workspace-agy.sh
$bindsym $mod+o exec ~/.local/bin/sway-next-workspace-opencode.sh
$bindsym $mod+c exec ~/.local/bin/sway-next-workspace-agycode.sh

# Desvincular toggle split por defecto de $mod+e para usar Yazi
$unbindsym $mod+e
$bindsym $mod+e exec ~/.local/bin/sway-next-workspace-yazi.sh

# Asistente de Música Flotante sobre Feishin / Navidrome (KISS)
for_window [app_id="feishin-ai"] floating enable, resize set 850 550, move position center
$bindsym $mod+m exec kitty --app-id feishin-ai --title "Feishin Music Assistant" feishin-ai
