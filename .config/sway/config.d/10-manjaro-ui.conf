# ==============================================================================
# Manjaro Sway UI & Rules
# ==============================================================================

# --- Color Scheme (Matcha-Green / Maia) ---
set $maia #16a085
set $bg-color #141a1b
set $text-color #eeeeee
set $inactive-bg #282a2b

# Property Name         Border  BG       Text    Indicator Child Border
client.focused          $maia   $maia    $bg-color $maia     $maia
client.focused_inactive $inactive-bg $inactive-bg $text-color $inactive-bg $inactive-bg
client.unfocused        $inactive-bg $bg-color $text-color $inactive-bg $inactive-bg
client.urgent           #Cd3f45 #Cd3f45  $text-color #db7b55 #Cd3f45

# --- Window Rules ---
# Smart gaps (don't show gaps if there's only one window)
smart_gaps on

# Floating mode for common dialogs
for_window [title="(?:Open|Save) (?:File|Folder|As)"] floating enable, resize set 800 600
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable

# Specific apps
for_window [app_id="pamac-manager"] floating enable
for_window [app_id="floating_shell"] floating enable, border pixel 1, sticky enable
for_window [app_id="" title="Picture in picture"] floating enable, sticky enable
for_window [app_id="" title="Picture-in-Picture"] floating enable, sticky enable

# Inhibition
seat * shortcuts_inhibitor disable
