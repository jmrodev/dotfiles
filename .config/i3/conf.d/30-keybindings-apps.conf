# ==============================================================================
# i3wm Application Keybindings
# Contiene atajos de teclado para lanzar aplicaciones específicas.
# Atajos ajustados para evitar conflictos con los plugins de Rofi ($mod+alt+...).
# ==============================================================================

# --- Lanzamiento Directo de Aplicaciones ---
# Atajo cambiado de $mod+Mod1+g a $mod+Control+g
bindsym $mod+Control+g exec google-chrome-stable

# Atajo cambiado de $mod+Mod1+n (nvim) a $mod+Control+n
bindsym $mod+Control+n exec xfce4-terminal -e nvim

# Atajo cambiado de $mod+Mod1+r (ranger) a $mod+Control+r
bindsym $mod+Control+r exec xfce4-terminal -e ranger

# Mantener $mod+Mod1+t para pcmanfm si no hay conflicto.
# Si prefieres consistencia, podrías cambiarlo a $mod+Control+t también.
bindsym $mod+Mod1+t exec pcmanfm