# ==============================================================================
# i3wm Rofi Keybindings
# Contiene todos los atajos de teclado relacionados con Rofi y sus plugins.
# Preferencia: Mod4 (Super) + Mod1 (Alt) para plugins.
# ==============================================================================

# --- Lanzadores Principales y Menús con Rofi ---
# Lanzador de aplicaciones principal (drun: desktop run) con Rofi
bindsym $mod+d exec --no-startup-id "rofi -show drun -show-icons"

# Cambiador de ventanas con Rofi (Mod1+Tab es Alt+Tab)
bindsym Mod1+Tab exec --no-startup-id "rofi -show window -show-icons"

# Configuración para ejecutar comandos de shell de Rofi (usando Shift+Enter en Rofi drun/run)
# Ajustado para Zsh y xfce4-terminal.
bindsym $mod+Control+Return exec --no-startup-id rofi -show drun -run-shell-command 'xfce4-terminal -e "zsh -ic '\''{cmd} && read}'\'''

# Menú de gestión de energía con Rofi (Asignado a $mod+x para "exit")
# Asegúrate de que rofi-power-menu-git esté instalado desde AUR.
bindsym $mod+x exec --no-startup-id rofi -show p -modi p:rofi-power-menu

# Script de montaje/desmontaje de discos
# Asegúrate de que el script ~/.local/bin/mount_disks.sh exista y sea ejecutable.
bindsym $mod+m exec --no-startup-id ~/.local/bin/mount_disks.sh

# Mi menú personalizado de Rofi (Asignado a $mod+c para "custom")
# Asegúrate de que el script ~/.local/bin/my_rofi_menu.sh exista y sea ejecutable.
bindsym $mod+c exec --no-startup-id ~/.local/bin/my_rofi_menu.sh

# --- Plugins de Rofi Adicionales (Con Mod4+Mod1+... para evitar conflictos) ---
# Asegúrate de que los paquetes correspondientes estén instalados vía yay.

# Rofi Autorandr (gestión de perfiles de pantalla)
bindsym Mod4+Mod1+a exec --no-startup-id rofi -show arandr -modi "arandr:rofi-autorandr"

# Rofi Bluetooth (gestión de dispositivos Bluetooth)
bindsym Mod4+Mod1+b exec --no-startup-id rofi -show bluetooth -modi "bluetooth:rofi-bluetooth"

# Rofi Browser (lanzador de navegador web con búsqueda rápida)
bindsym Mod4+Mod1+o exec --no-startup-id rofi -show browser -modi "browser:rofi-browser"

# Rofi Calculator (calculadora en tiempo real)
bindsym Mod4+Mod1+k exec --no-startup-id rofi -show calc -modi "calc:rofi-calc"

# Rofi GH (interacción con GitHub CLI)
# Conflictos resueltos: GH ahora usa Mod4+Mod1+g
bindsym Mod4+Mod1+g exec --no-startup-id rofi -show gh -modi "gh:rofi-gh"

# Rofi MPC (control de MPD/MPRIS)
bindsym Mod4+Mod1+p exec --no-startup-id rofi -show mpc -modi "mpc:rofi-mpc"

# Rofi MPD (control específico para MPD)
# Si lo necesitas, puedes usar Mod4+Mod1+m (para "music" o "MPD")
bindsym Mod4+Mod1+m exec --no-startup-id rofi -show mpd -modi "mpd:rofi-mpd"

# Rofi Randr (configuración de pantalla xrandr)
# Conflictos resueltos: Randr ahora usa Mod4+Mod1+r
bindsym Mod4+Mod1+r exec --no-startup-id rofi -show randr -modi "randr:rofi-randr"

# Rofi Screenshot (menú de captura de pantalla)
bindsym Mod4+Mod1+s exec --no-startup-id rofi -show scr -modi "scr:rofi-screenshot"

# Rofi Search (búsqueda web configurable)
bindsym Mod4+Mod1+slash exec --no-startup-id rofi -show search -modi "search:rofi-search"

# Rofi Wifi Menu (gestor de conexión Wi-Fi)
bindsym Mod4+Mod1+w exec --no-startup-id rofi -show wifi -modi "wifi:rofi-wifi-menu"