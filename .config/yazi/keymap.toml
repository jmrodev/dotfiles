[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin --sync smart-enter"
desc = "Entrar al directorio o abrir archivo si es archivo"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin --sync smart-enter"
desc = "Entrar al directorio o abrir archivo si es archivo"

[[mgr.prepend_keymap]]
on   = [ "<ScrollUp>" ]
run  = "seek -5"
desc = "Scroll arriba en preview"

[[mgr.prepend_keymap]]
on   = [ "<ScrollDown>" ]
run  = "seek 5"
desc = "Scroll abajo en preview"
