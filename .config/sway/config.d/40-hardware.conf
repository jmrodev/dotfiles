# ==============================================================================
# Hardware Configuration (Touchpad & Audio)
# ==============================================================================

# --- Touchpad ---
input "2:14:ETPS/2_Elantech_Touchpad" {
    tap enabled
    natural_scroll enabled
    dwt enabled
}

# --- Volume Controls (F6, F7, F8) ---
# Mute
bindsym F6 exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Volume Down
bindsym F7 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Volume Up
bindsym F8 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# --- Standard Media Keys (Fallback) ---
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# --- Brightness (Common on many laptops) ---
bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-
