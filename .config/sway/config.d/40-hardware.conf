# ==============================================================================
# Hardware Configuration (Touchpad & Audio)
# ==============================================================================

# --- Touchpad ---
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    tap_button_map lrm
}

# --- Volume Controls (F6, F7, F8) ---
# Mute
bindsym --locked F6 exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Volume Down
bindsym --locked F7 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Volume Up
bindsym --locked F8 exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# --- Standard Media Keys (Fallback) ---
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# --- Brightness (Common on many laptops) ---
bindsym --locked XF86MonBrightnessUp exec brightnessctl set +5%
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
