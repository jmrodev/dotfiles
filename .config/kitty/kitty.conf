# ==========================================
# Configuración Optimizada de Kitty
# ==========================================

# Confirmación al cerrar ventana (0 = cerrar sin confirmar)
confirm_os_window_close 0

# Desactivar campana acústica molesta
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback ágil y amplio
scrollback_lines 10000

# Ocultar puntero del mouse al escribir para no tapar texto
mouse_hide_wait 2.0

# Margen interior limpio
window_padding_width 4

# Detección de URLs para abrir directamente con click
detect_urls yes
open_url_with default
url_prefixes file ftp ftps git hdfs http https irc ircs sftp vnc

# ==========================================
# Copiar y Pegar Intuitivo (Mouse y Teclado)
# ==========================================

# 1. Copiar automáticamente al seleccionar con el mouse
copy_on_select clipboard
strip_trailing_spaces smart

# 2. Ctrl+C inteligente:
# - Si hay texto seleccionado: lo copia al portapapeles y quita la selección
# - Si NO hay texto seleccionado: envía interrupción normal (SIGINT para cancelar procesos)
map ctrl+c copy_and_clear_or_interrupt

# 3. Ctrl+V pega directamente desde el portapapeles (igual que en navegadores/editores)
map ctrl+v paste_from_clipboard

# Mantener también los atajos tradicionales de terminal
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# 4. Click del medio (o tap de 3 dedos) pega directamente desde el portapapeles
mouse_map middle release ungrabbed paste_from_clipboard
mouse_map shift+middle release ungrabbed,grabbed paste_from_clipboard

# ==========================================
# Tema Dinámico Sincronizado
# ==========================================
include current-theme.conf

