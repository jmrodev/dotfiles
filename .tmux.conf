# ==========================================
# Configuración Optimizada de Tmux
# ==========================================

# Habilitar soporte de mouse (selección con arrastre, rueda para scroll, clicks)
set -g mouse on

# Copiar automáticamente al portapapeles "Primary" (selección) al soltar el mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy -p" \; display-message "¡Copiado al portapapeles del sistema!"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy -p" \; display-message "¡Copiado al portapapeles del sistema!"

# Pegar la selección (tres dedos / click del medio) leyendo del Primary con modo bracketed (-p)
bind-key -n MouseDown2Pane run-shell "wl-paste -p -n | tmux load-buffer - && tmux paste-buffer -p"

# Atajo de teclado tradicional de tmux para pegar desde el portapapeles del sistema
bind-key ] run-shell "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p"

# ==========================================
# Integración y Atajos (Estilo Vim)
# ==========================================

# Cambiar el prefix de Ctrl-b a Ctrl-a (más accesible)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Forzar el modo vi para la navegación del buffer
set-window-option -g mode-keys vi

# Dividir paneles con 'v' (vertical) y 's' (horizontal) estilo Vim
unbind '"'
unbind %
bind v split-window -h
bind s split-window -v

# Moverse entre paneles con hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionar paneles rápido con Mayúsculas + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================================
# Integración con Neovim (vim-tmux-navigator)
# ==========================================
# Si el panel activo está corriendo Vim/Neovim, le pasa las teclas (C-h/j/k/l).
# Si es una terminal normal, Tmux intercepta y se mueve de panel.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ==========================================
# UI y Barra de Estado (Minimalista)
# ==========================================
# Configurar terminal para que NvChad no pierda los colores reales
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Eliminar el delay de la tecla ESC (CRÍTICO para usuarios de Vim/Neovim)
set -sg escape-time 0

# Ubicar la barra arriba (queda mucho más limpio visualmente)
set-option -g status-position top

# Estilo base transparente/minimalista
set -g status-style bg=default,fg=white
set -g status-interval 1

# Lado izquierdo: Solo el nombre de la sesión
set -g status-left-length 40
set -g status-left "#[fg=green,bold] ❐ #S #[fg=default]  "

# Centro: Las ventanas abiertas (Pestañas)
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=cyan,bold] #I:#W*"

# Lado derecho: Hora minimalista
set -g status-right-length 40
set -g status-right "#[fg=brightblack]%H:%M "

# ==========================================
# Tmux Sessionizer (Teletransportación)
# ==========================================
# Prefix + f abre un popup flotante con FZF para saltar entre proyectos
bind-key f display-popup -E -w 60% -h 60% "~/.local/bin/tmux-sessionizer"

# Copiar al portapapeles del sistema desde el modo teclado (Vi mode)
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy -p" \; display-message "¡Copiado al portapapeles del sistema!"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy -p" \; display-message "¡Copiado al portapapeles del sistema!"
set-option -g default-shell /usr/bin/fish
